<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>二维码工具 - JZX Lite</title>
<style>
  :root { --orange:#f58220; --bg:#f7f8fa; }
  * { box-sizing:border-box; }
  body { font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; margin:0; background:var(--bg); color:#222; }
  .wrap { max-width:520px; margin:24px auto; padding:0 16px 40px; }
  h1 { font-size:18px; display:flex; align-items:center; gap:8px; }
  h1::before { content:""; width:22px; height:22px; border-radius:6px; background:var(--orange); display:inline-block; }
  .card { background:#fff; border-radius:12px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.06); margin-bottom:16px; }
  textarea { width:100%; height:90px; padding:8px; border:1px solid #ddd; border-radius:8px; font:13px/1.5 ui-monospace,monospace; resize:vertical; }
  button { background:var(--orange); border:none; color:#fff; padding:7px 14px; border-radius:8px; cursor:pointer; font-size:13px; }
  button.ghost { background:#eee; color:#333; }
  #qrbox { display:flex; justify-content:center; padding:12px; }
  #qrbox canvas { border:8px solid #fff; border-radius:4px; box-shadow:0 1px 6px rgba(0,0,0,.12); }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  input[type=file] { font-size:13px; }
  #decodeResult { margin-top:10px; padding:8px 10px; background:#f0f9eb; border-radius:8px; word-break:break-all; display:none; }
  #decodeResult.err { background:#fdecea; }
  a { color:var(--orange); word-break:break-all; }
  .tip { color:#888; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>二维码生成</h1>
  <div class="card">
    <textarea id="text" placeholder="输入文字或链接，自动生成二维码"></textarea>
    <div id="qrbox"><canvas id="cv"></canvas></div>
    <div class="row">
      <button id="dl">下载 PNG</button>
      <button class="ghost" id="copy">复制为图片</button>
      <span class="tip" id="genmsg"></span>
    </div>
  </div>

  <h1>二维码识别</h1>
  <div class="card">
    <input type="file" id="file" accept="image/*">
    <div class="tip" style="margin-top:6px">支持本地图片；网页图片请右键 →「识别图片二维码」。</div>
    <div id="decodeResult"></div>
  </div>
</div>
<script src="../vendor/qrcode.js"></script>
<script src="../vendor/qrcode_utf8.js"></script>
<script src="qr.js"></script>
</body></html>
